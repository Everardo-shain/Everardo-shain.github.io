- title: Multi-Factor and Odometric Aware Optimization for Next-Best-View 3D Reconstruction
  publishedIn:
    name: "IEEE Access"
    status: Under Review
    date: Submitted 5 August 2026
    url: https://ieeeaccess.ieee.org/
  authors:
  - name: Everardo Shain-Ruvalcaba
    url: https://orcid.org/0009-0001-5123-0557
  - name: Efraín López-Damian
    url: https://orcid.org/0000-0002-1113-929X
  paper:
    summary: This journal article extends prior work on the Next Best View (NBV) problem. It has two main contributions, a retuned multi-factor objective function (combining area, motion, and quality factors) and a robust optimization approach that explicitly accounts for odometric error. Robustness is achieved via a weighted combination of the nominal and expected objective function values, allowing the optimizer to counteract the effects of possible odometer errors. The approach is validated across two optimization methods (Simulated Annealing and an Evolution Strategy) and multiple simulated environments of varying complexity, showing that the benefit of robust optimization depends on scene complexity.
  categories: ["journal", "under-review"]
  tags: ["journal article", "next best view", "objective function","3D reconstruction","robust optimization"]

- title: Real-Time Detection of Cloned Spanish Audio in Telephone Calls Using Microcontrollers and Cloud Services
  publishedIn:
    name: "ACM Transactions on Privacy and Security"
    status: Under Review
    date: Submitted 30 April 2026
    url: https://dl.acm.org/journal/tops
  authors:
  - name: Ruben Villicaña
    url: https://orcid.org/0009-0007-1061-075X
  - name: Diana Paola Ayala-Roldan
    url: https://orcid.org/0009-0009-6079-8708
  - name: Everardo Shain-Ruvalcaba
    url: https://orcid.org/0009-0001-5123-0557
  - name: Alfredo Mantilla-Caeiros
    url: https://orcid.org/0009-0003-0043-5450
  - name: Alejandro Santos-Diaz
    url: https://orcid.org/0000-0001-5235-7325
  - name: Luis Montesinos
    url: https://orcid.org/0000-0003-3976-4190
  paper:
    summary: This journal article presents a collaborative project focused on developing a real-time system for detecting cloned Spanish audio during telephone calls, combining deep learning classification with a hardware-to-cloud prototype. Contributed with the design and implementation of the evaluation pipeline used to benchmark the deep learning models against a human perception survey. Isolated the specific survey audio pairs from the main dataset before retraining the models, preventing the training process from being influenced by these targeted inputs while preserving the general training and evaluation flow. Built a target-audio inference pipeline to extract the model predictions for those isolated pairs and developed a mapping logic to translate the individual real/fake probabilities into pair-level outcomes, enabling a direct human-vs-model comparison.
  categories: ["journal", "under-review"]
  tags: ["journal article", "deep learning", "audio deepfakes","embedded systems", "cloud computing (AWS)", "signal processing", "cybersecurity"]

- title: Tuning and Comparison of Optimization Algorithms for the Next Best View Problematic
  publishedIn:
    name: "IEEE Access (Volume: 12)"
    status: Published
    date: 9 December 2024
    url: https://ieeexplore.ieee.org/xpl/tocresult.jsp?isnumber=10380310&punumber=6287639
  authors:
  - name: Everardo Shain-Ruvalcaba
    url: https://orcid.org/0009-0001-5123-0557
  - name: Efraín López-Damian
    url: https://orcid.org/0000-0002-1113-929X
  paper:
    summary: This journal article presents the tuning and comparison of various optimization algorithms on the Next Best View (NBV) problem. A simulated 5 Degree-of-Freedom (DOF) mobile robot with a mounted simulated range sensor was used on a Virtual Reality Modeling Language (VRML) environment, and the space discretization was made using a voxel map. The optimization methods tested were Nelder-Mead, an Evolution Strategy, and Simulated Annealing. Their repeatability was tested on a laboratory model, a room with a cube and a pyramid inside it, and a study room with multiple furniture and windows.
    url: https://ieeexplore.ieee.org/document/10781375
    file: https://ieeexplore.ieee.org/stamp/stamp.jsp?tp=&arnumber=10781375
  categories: ["journal"]
  tags: ["journal article", "next best view", "objective function","optimization algorithms", "3D reconstruction"]

- title: View planning for three-dimensional environment reconstruction using the Next Best View method
  publishedIn:
    name: Instituto Tecnológico y de Estudios Superiores de Monterrey
    status: Published
    date: 3 December 2024
    url: https://repositorio.tec.mx/home
  authors:
  - name: Everardo Shain-Ruvalcaba
    url: https://orcid.org/0009-0001-5123-0557
  - name: Efraín López-Damian
    url: https://orcid.org/0000-0002-1113-929X
  paper:
    summary: This master's thesis describes the impact of the objective function and optimization methods on the Next Best View problem, which consists in finding the next position that the sensor or camera needs to take to scan an object or scenery in its totality. A multi-factor objective function was designed including area and motion factors. Global optimization tasks such as a backstepping technique to escape local minima and a dynamic change in the objective function were implemented. Optimization methods such as Nelder-Mead, an Evolution Strategy, and Simulated Annealing were tuned and compared on three different scenarios.
    url: https://repositorio.tec.mx/items/e2855326-09cd-47a7-8094-6b66793b2796
    file: https://docs.google.com/viewerng/viewer?url=https://repositorio.tec.mx/server/api/core/bitstreams/1dd975ac-aa7d-41c1-b89c-c7cbdca06675/content
  categories: ["thesis"]
  tags: ["thesis","next best view", "objective function","optimization algorithms", "3D reconstruction"]